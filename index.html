<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Syne:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #04060d;
      --mid: #080d1a;
      --glow: #5b9cf6;
      --gold: #c9a96e;
      --white: #e8eaf0;
      --muted: #5a607a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse 60% 50% at 50% 55%, rgba(91,156,246,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 72% 20%, rgba(201,169,110,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.8rem 3.5rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      animation: fadeUp 1s ease 0.2s forwards;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }

    .logo-word {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.65rem;
      letter-spacing: 0.18em;
      color: var(--white);
    }

    .logo-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 10px 3px rgba(91,156,246,0.7);
      animation: pulse 2.8s ease-in-out infinite;
      margin-bottom: 2px;
    }

    .nav-label {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 2rem;
    }

    .eyebrow {
      font-size: 0.68rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: fadeUp 0.9s ease 0.6s forwards;
    }

    .headline-wrap {
      position: relative;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(4.5rem, 10vw, 9rem);
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--white);
      opacity: 0;
      animation: fadeUp 1s ease 0.85s forwards;
    }

    .headline em {
      font-style: italic;
      color: var(--glow);
      text-shadow: 0 0 60px rgba(91,156,246,0.4);
    }

    .coming-soon {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      border: 1px solid rgba(91,156,246,0.25);
      border-radius: 100px;
      padding: 0.65rem 1.6rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--glow);
      opacity: 0;
      animation: fadeUp 0.9s ease 1.2s forwards;
      position: relative;
      overflow: hidden;
    }

    .coming-soon::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(91,156,246,0.05);
    }

    .coming-soon-bar {
      width: 18px;
      height: 1px;
      background: var(--glow);
      box-shadow: 0 0 6px 1px rgba(91,156,246,0.8);
    }

    .sub {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1rem, 2vw, 1.35rem);
      color: var(--muted);
      max-width: 38ch;
      line-height: 1.6;
      opacity: 0;
      animation: fadeUp 0.9s ease 1.45s forwards;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      animation: fadeUp 0.8s ease 1.7s forwards;
    }

    .footer-left {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .footer-right {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .rule {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(91,156,246,0.15), transparent);
      opacity: 0;
      animation: fadeIn 1s ease 1.5s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 10px 3px rgba(91,156,246,0.7); }
      50%       { box-shadow: 0 0 18px 6px rgba(91,156,246,0.4); }
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>
<div class="atmosphere"></div>

<div class="page">
  <header>
    <div class="logo">
      <span class="logo-word">LUMINO</span>
      <div class="logo-dot"></div>
    </div>
    <span class="nav-label">Agentic AI</span>
  </header>

  <div class="hero">
    <p class="eyebrow">Intelligent by design</p>
    <div class="headline-wrap">
      <h1 class="headline">Agents that <em>act.</em></h1>
    </div>
    <div class="coming-soon">
      <div class="coming-soon-bar"></div>
      Coming Soon
      <div class="coming-soon-bar"></div>
    </div>
    <p class="sub">We're building autonomous AI systems that reason, adapt, and work — so your teams don't have to wait.</p>
  </div>

  <div>
    <div class="rule"></div>
    <footer style="margin-top: 1.4rem;">
      <span class="footer-left">© 2025 Lumino</span>
      <span class="footer-right">lumino.ai</span>
    </footer>
  </div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H, particles;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeParticle() {
    const isgold = Math.random() < 0.2;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      vx: (Math.random() - 0.5) * 0.12,
      vy: (Math.random() - 0.5) * 0.12,
      alpha: Math.random() * 0.5 + 0.1,
      color: isgold ? '201,169,110' : '91,156,246',
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.005 + Math.random() * 0.01,
    };
  }

  function init() {
    resize();
    particles = Array.from({ length: 130 }, makeParticle);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (const p of particles) {
      p.pulse += p.pulseSpeed;
      const a = p.alpha * (0.7 + 0.3 * Math.sin(p.pulse));

      ctx.beginPath();
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, `rgba(${p.color},${a})`);
      g.addColorStop(1, `rgba(${p.color},0)`);
      ctx.fillStyle = g;
      ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
      ctx.fill();

      p.x += p.vx;
      p.y += p.vy;

      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20;
      if (p.y > H + 20) p.y = -20;
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', () => { resize(); });
  init();
  draw();
</script>
</body>
</html>
